name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.17.4 check .
      - run: pipx run ruff==0.17.4 format --check .
      - run: python3 scripts/build_site.py && git diff --exit-code docs/index.html

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grader: [pre-v1.0.1, v1.0.1]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/setup-tau2.sh
      - run: .tau2/${{ matrix.grader }}/venv/bin/python -m unittest discover -s tests -t .
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
      - run: .tau2/${{ matrix.grader }}/venv/bin/python examples/report_blind_spot.py
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
